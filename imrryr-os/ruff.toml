# Ruff para Imrryr OS — solo errores reales, no debates de estilo.
# El proyecto usa comentarios largos y f-strings decorativos a propósito;
# acá nos importan los bugs que una máquina puede detectar sola.
target-version = "py310"

extend-exclude = [
  ".venv",
  ".opencode_home",
  ".run",
  ".pytest_cache",
  "dist",
  "vault",
  "semillas",
]

[lint]
select = [
  "E9", # error de sintaxis / indentación rota
  "F",  # pyflakes: import sin usar, nombre indefinido, variable muerta…
]

[lint.per-file-ignores]
# Los MCP .mcp.json se validan aparte; skills con efectos al importar se
# revisan manualmente. Nada que ignorar hoy.
