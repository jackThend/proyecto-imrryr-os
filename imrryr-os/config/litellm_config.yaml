# =====================================================================
# Imrryr OS — Configuración del proxy LiteLLM (Traductor Agnóstico)
# ---------------------------------------------------------------------
# Pilar: Neutralidad de Modelos. OpenCode NUNCA habla directo con los
# proveedores; enruta todo a través de LiteLLM en :4000, que traduce al
# backend real. Para conmutar "cerebro", basta cambiar el model_name.
#
# Arranque manual:  litellm --config config/litellm_config.yaml --port 4000
# (startup.py lo automatiza en la Subfase 1.3)
#
# NOTA: Sin master_key ni general_settings => modo pass-through sin DB de
# tracking (Fase 1, local-first, un solo usuario en 127.0.0.1). LiteLLM no
# intenta importar Prisma en este modo. El Guardia de Seguridad (Fase 4)
# añadirá observabilidad propia con SQLite puro si se requiere.
# =====================================================================

model_list:
  # NEUTRALIDAD DE MODELOS: acá NO hay ningún modelo por defecto. El único
  # modelo que existe es "imrryr-activo", el alias estable que apunta a la
  # cuenta de IA que el usuario eligió en Ajustes > Cuentas de IA — sea el
  # proveedor que sea. Antes vivían acá alias fijos de Gemini, lo que hacía
  # que el sistema cayera a Google aunque el usuario hubiera elegido otro
  # proveedor; eso contradecía este pilar, así que se quitaron.
  # El bloque de abajo lo regenera config/cuentas_ia.py al activar una cuenta.

  # --- IMRRYR-ACTIVO (autogenerado por Cuentas de IA, no editar a mano) ---
  - model_name: imrryr-activo
    litellm_params:
      model: openai/kimi-k2.7-code
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/IMRRYR_ACTIVE_API_KEY
      extra_headers:
        x-opencode-session: ses_imrryr
  # --- FIN IMRRYR-ACTIVO ---

litellm_settings:
  drop_params: true
  telemetry: false                   # privacidad: no reportar uso a LiteLLM
