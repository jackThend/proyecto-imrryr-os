nombre: "Agente de Navegación"
descripcion: >
  Busca en la web y abre páginas para leer su contenido (usando un
  navegador headless real cuando la página necesita JavaScript para
  mostrar su contenido). Cuando el usuario pide que le lea algo en voz
  alta (ej. "léeme las noticias de tecnología", "búscame X y léemelo"),
  genera el audio con leer_en_voz para que el dashboard lo reproduzca —
  nunca lee nada sin que se lo pidan explícitamente. Piensa en esto como
  un asistente de navegación de manos libres: útil para que el usuario
  escuche contenido mientras trabaja en otra parte del sistema (agenda,
  finanzas, etc.).
herramientas_permitidas:
  - navegar_web
  - leer_en_voz
modelo_preferido: imrryr-activo
activo: true
